openapi: 3.1.0
info:
  title: Bookstore Catalog API
  version: 1.0.0
  description: Catalog reads use PostgreSQL. Administration and internal checkout require the demo-integrated profile.
security: []
paths:
  /api/v1/books:
    get:
      operationId: listBooks
      summary: List books in UUID order with an optional category or literal text filter
      parameters:
        - name: category
          in: query
          description: Trimmed exact category name (case sensitive).
          schema: {type: string, minLength: 1, maxLength: 80}
        - name: q
          in: query
          description: Trimmed case-insensitive substring of title or author. Percent, underscore and backslash are literal.
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 1}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 12}
      responses:
        '200':
          description: A page of books; hasNext means the same search found another row.
          content:
            application/json:
              schema:
                type: object
                required: [books, page, hasNext]
                properties:
                  books: {type: array, items: {$ref: '#/components/schemas/Book'}}
                  page: {type: integer, minimum: 1}
                  hasNext: {type: boolean}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/InvalidCatalogData'}
  /api/v1/books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      operationId: getBook
      responses:
        '200':
          description: Book, optional presentation metadata, and currently available stock.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookDetail'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '502': {$ref: '#/components/responses/InvalidCatalogData'}
  /api/v1/categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Category names in ascending order, preserving their original value.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: {type: array, items: {type: string}}
  /api/v1/admin/books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      operationId: getAdminBook
      security: [{catalogAdminToken: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminBook'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '502': {$ref: '#/components/responses/InvalidCatalogData'}
    patch:
      operationId: updateBookTitle
      description: Change the title only. Requires the current version; a stale version changes nothing.
      security: [{catalogAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, expectedVersion]
              properties:
                title: {type: string, minLength: 1, maxLength: 500}
                expectedVersion: {$ref: '#/components/schemas/NonnegativeSafeInteger'}
      responses:
        '200': {$ref: '#/components/responses/AdminBook'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '409':
          description: VERSION_CONFLICT
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: ADMIN_WRITES_CLOSED when the operator disables title editing.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502': {$ref: '#/components/responses/InvalidCatalogData'}
  /api/v1/internal/checkout/snapshots:
    post:
      operationId: snapshotCheckoutBooks
      description: Return current catalog title, unit price and available stock for each requested SKU in UUID order.
      security: [{orderServiceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Each bookId may occur once.
                  items: {$ref: '#/components/schemas/CheckoutLine'}
      responses:
        '200':
          description: A single authoritative read. The snapshot does not reserve stock.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines: {type: array, items: {$ref: '#/components/schemas/SnapshotLine'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '502': {$ref: '#/components/responses/InvalidCatalogData'}
  /api/v1/internal/checkout/reservations/{submissionId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: reserveCheckoutBooks
      description: Reserve all lines atomically. HELD confirms the exact submitted quantity and price of each line. Stored decisions replay for the same canonical payload. RELEASED never reopens inventory.
      security: [{orderServiceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Unique book IDs; line order is immaterial.
                  items: {$ref: '#/components/schemas/ReserveLine'}
      responses:
        '200':
          description: Committed reservation decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationDecision'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: RESERVATION_CONFLICT when a different payload was previously recorded for this ID.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: releaseCheckoutBooks
      description: Release the recorded lines atomically. A release for an unknown ID writes a tombstone that blocks late reservation. Repeats have no further effect.
      security: [{orderServiceToken: []}]
      responses:
        '204': {description: Reservation is released or tombstoned.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    catalogAdminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Configured Keycloak issuer; audience bookstore-catalog, client bookstore-bff and realm role bookstore-admin.
    orderServiceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Configured Keycloak issuer; audience bookstore-catalog-internal, client bookstore-order and realm role bookstore-order-service.
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    InvalidRequest:
      description: INVALID_REQUEST
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthenticated:
      description: UNAUTHORIZED – Bearer token missing or invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: FORBIDDEN – Token does not grant access to the endpoint.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookNotFound:
      description: BOOK_NOT_FOUND
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InvalidCatalogData:
      description: CATALOG_DATA_INVALID – Stored money or version cannot be represented by the API.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AdminBook:
      description: Authoritative book with its current version.
      content: {application/json: {schema: {$ref: '#/components/schemas/AdminBook'}}}
  schemas:
    NonnegativeSafeInteger:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Code for the currency of this book. CNY and USD are display currencies; Order only transacts in CNY.
    Book:
      type: object
      required: [id, title, author, category, priceMinor, currency, stock]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        author: {type: string}
        category: {type: string}
        priceMinor: {$ref: '#/components/schemas/NonnegativeSafeInteger'}
        currency: {$ref: '#/components/schemas/Currency'}
        stock: {type: integer, minimum: 0, description: Available copies.}
        coverUrl: {type: string, format: uri, description: Omitted when a cover is unavailable.}
    BookDetail:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            description: {type: string, description: Omitted when a description is unavailable.}
    AdminBook:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          required: [version]
          properties:
            version: {$ref: '#/components/schemas/NonnegativeSafeInteger'}
    CheckoutLine:
      type: object
      additionalProperties: false
      required: [bookId, quantity]
      properties:
        bookId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 99}
    SnapshotLine:
      type: object
      required: [bookId, quantity, title, unitPriceMinor, currency, stock]
      properties:
        bookId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 99}
        title: {type: string}
        unitPriceMinor: {$ref: '#/components/schemas/NonnegativeSafeInteger'}
        currency: {$ref: '#/components/schemas/Currency'}
        stock: {type: integer, minimum: 0}
    ReserveLine:
      type: object
      additionalProperties: false
      required: [bookId, quantity, unitPriceMinor, currency]
      properties:
        bookId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 99}
        unitPriceMinor: {$ref: '#/components/schemas/NonnegativeSafeInteger'}
        currency: {$ref: '#/components/schemas/Currency'}
    ReservationDecision:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {type: string, enum: [HELD, RELEASED]}
        - type: object
          additionalProperties: false
          required: [state, reason]
          properties:
            state: {type: string, const: REJECTED}
            reason: {type: string, enum: [BOOK_NOT_FOUND, PRICE_CHANGED, INSUFFICIENT_STOCK]}
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, BOOK_NOT_FOUND, VERSION_CONFLICT, RESERVATION_CONFLICT, ADMIN_WRITES_CLOSED, CATALOG_DATA_INVALID, INTERNAL_ERROR]
